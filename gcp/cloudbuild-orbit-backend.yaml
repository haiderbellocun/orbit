# Build Orbit API (Node/Express desde orbit-api/) y despliegue en Cloud Run.
# Ejecutar desde la raíz del monorepo:
#   gcloud builds submit . --config=gcp/cloudbuild-orbit-backend.yaml --project=it-fab-contenido-edu-6
#
# La primera vez puede hacer falta crear el servicio con variables/secretos/Cloud SQL
# en la consola o con flags extra; los redeploys posteriores suelen conservar la config
# del servicio al actualizar solo la imagen.
substitutions:
  _REGION: us-central1
  _SERVICE: orbit-backend
  _AR_REPO: cloud-run-source-deploy

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
      - orbit-api

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
