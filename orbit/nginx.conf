server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # No enviar Cross-Origin-Opener-Policy: con "same-origin-allow-popups" algunos Chrome
    # siguen bloqueando postMessage del popup de Google Identity Services. El valor por
    # defecto del navegador (sin COOP) es el más compatible con el botón en modo popup.

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
