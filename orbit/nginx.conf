server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Si algún día el frontend hace de proxy a la API, evita 413 por el default 1m de nginx.
    client_max_body_size 64m;

    # No enviar Cross-Origin-Opener-Policy: con "same-origin-allow-popups" algunos Chrome
    # siguen bloqueando postMessage del popup de Google Identity Services. El valor por
    # defecto del navegador (sin COOP) es el más compatible con el botón en modo popup.

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The sandboxed DOOM iframe has an opaque origin. Limit CORS to its static
    # sidecar files so Emscripten can fetch WASM/data without application access.
    location /easter-eggs/doom/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
